<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="陶瓷产品与文创设计作品集，整理产品效果、文化 IP、手绘推导、工艺实践与三维建模作品。" />
    <meta property="og:title" content="Xiaolai | Ceramic Product & Cultural Creative Design" />
    <meta property="og:description" content="陶瓷产品与文创设计作品集，整理产品效果、文化 IP、手绘推导、工艺实践与三维建模作品。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/thumbs/render-06.jpg?v=20260517-wm1" />
    <title>Xiaolai | Ceramic Product & Cultural Creative Design</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260517-14" />
  </head>
  <body>
    <header class="site-header" aria-label="作品集导航">
      <a class="brand" href="#top" aria-label="回到首页">
        <span class="brand-mark"></span>
        <span>Xiaolai</span>
      </a>
      <nav class="nav-links" aria-label="页面导航">
        <a href="#projects">精选项目</a>
        <a href="#gallery">作品展廊</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Ceramic Product / Cultural Creative</p>
          <h1 id="hero-title" class="hero-title" aria-label="陶瓷产品文创设计作品集">
            <span class="hero-title-line hero-title-primary">陶瓷产品</span>
            <span class="hero-title-line hero-title-secondary">文创设计作品集</span>
          </h1>
          <p class="hero-lead">
            以陶瓷器物、地域文化元素和产品呈现为主线，整理产品效果、文化 IP、手绘推导、工艺实践与三维建模。
          </p>
          <div class="hero-meta" aria-label="作品集概览">
            <span><strong id="project-count">8</strong> 组精选项目</span>
            <span><strong id="asset-count">66</strong> 件作品展示</span>
            <span>持续创作</span>
          </div>
        </div>
        <div class="hero-board" aria-label="代表作品拼贴">
          <img class="hero-img hero-img-a" src="assets/thumbs/render-06.jpg?v=20260517-wm1" alt="清明上河图茶具礼盒效果图" />
          <img class="hero-img hero-img-b" src="assets/thumbs/poster-08.jpg?v=20260517-wm1" alt="客家文化 IP 海报" />
          <img class="hero-img hero-img-c" src="assets/thumbs/craft-07.jpg?v=20260517-wm1" alt="陶瓷饰品手工作品" />
          <img class="hero-img hero-img-d" src="assets/thumbs/model-10.jpg?v=20260517-wm1" alt="山水主题餐具三维建模" />
          <img class="hero-img hero-img-e" src="assets/thumbs/sketch-04.jpg?v=20260517-wm1" alt="陶瓷设计手绘推导" />
        </div>
      </section>

      <section id="projects" class="section-shell selected-section">
        <div class="project-browser">
          <div class="project-chooser">
            <div class="section-heading project-heading">
              <p class="eyebrow">Selected Projects</p>
              <h2>精选项目</h2>
            </div>
            <div id="project-grid" class="project-grid" aria-label="精选项目切换"></div>
          </div>
          <section id="project-detail" class="detail-section" aria-live="polite"></section>
        </div>
      </section>

      <section id="gallery" class="section-shell gallery-section">
        <div class="gallery-heading">
          <p class="eyebrow">Gallery</p>
          <h2>作品展廊</h2>
        </div>
        <div id="gallery-filters" class="gallery-filter" role="list" aria-label="作品类别"></div>
        <div id="gallery-grid" class="gallery-grid"></div>
      </section>

    </main>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox-close" type="button" aria-label="关闭图片预览">×</button>
      <figure>
        <img id="lightbox-image" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
    </div>

    <script src="data.js?v=20260517-14"></script>
    <script src="app.js?v=20260517-14"></script>
  </body>
</html>
